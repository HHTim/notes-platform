<div class="learn"><p class="lbl">讀完這課你會</p><ul><li>用「會打架」解釋為什麼一台機器只跑一個服務</li><li>說出當年上線一個服務為什麼要等兩個月</li></ul></div>
<section class="plain">
    <p class="era">第一代・實體機</p>
    <h3 class="head">買一台機器，只跑一個服務</h3>
    <p>以前要上線一個新服務，流程是：填採購單 → 等機器送到 → 搬進機房 → 裝作業系統 → 裝環境 → 部署。前後兩個月跑不掉。</p>
    <p>那為什麼不兩個服務擠一台？因為<strong>它們會打架</strong>——一個要舊版 Java、一個要新版，裝上去互相蓋掉；而且一個寫爆記憶體，另一個跟著陪葬。</p>

<div class="keys"><p class="lbl">重點整理</p><ul><li>兩個服務要的環境會互相蓋掉、資源會互搶，所以一台只跑一個。</li><li>機器效能大部分閒著，要多一個服務就再買一台、再等兩個月。</li></ul></div>
