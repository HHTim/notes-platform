name: deploy
on:
  push:
    branches: [main, ask-ai]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# 同一時間只跑一個部署；排隊中的舊 run 會被略過，但正在跑的不取消，讓已開始的發佈完整跑完
# （照 GitHub 官方 Pages 範本 actions/starter-workflows 的 pages/static.yml）
# 依分支分開：兩條分支共用群組時，一條的 push 會把另一條排隊中的發佈略過
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # 跟本機一致（python3 --version → 3.14.x），避免 CI 與本機建置結果不同
      - name: 測試
        run: python3 -m unittest discover -s builder/tests -v
      - name: 建置
        run: python3 builder/build.py
      - name: 檢查產出的 JavaScript 語法
        run: for f in dist/*.js; do node --check "$f"; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # 哪條分支上線由 repo 變數 DEPLOY_BRANCH 決定（main＝沒有 AI、ask-ai＝AI 版）；另一條只跑測試與建置
    if: github.ref_name == vars.DEPLOY_BRANCH
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
